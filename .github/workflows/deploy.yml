name: Build and Deploy Time Server

on:
  push:
    branches: [ main ] # Запускаем workflow при пуше в ветку main

permissions:
  contents: read
  packages: write # Разрешаем запись пакетов (образов) в GitHub Container Registry

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/time-server-api # Полное имя Docker-образа в GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Клонируем репозиторий в раннер
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        # Логинимся в GHCR с помощью встроенного GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # Собираем Docker-образ и пушим его в GHCR с тегами latest и по SHA коммита
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push # Деплой запускается только после успешной сборки и пуша образа
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        # Подключаемся по SSH к удалённому серверу и разворачиваем там контейнер из GHCR
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GHCR_USERNAME: ${{ github.actor }}       # Берём логин текущего GitHub-пользователя
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Используем встроенный токен GitHub Actions
        with:
          host: ${{ secrets.SSH_HOST }}         # Хост удалённого сервера
          username: ${{ secrets.SSH_USERNAME }} # Пользователь на сервере
          key: ${{ secrets.SSH_PRIVATE_KEY }}   # Приватный SSH-ключ
          port: ${{ secrets.SSH_PORT }}         # Порт SSH (обычно 22)
          script: |
            set -e

            echo "Login to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "Pull latest image..."
            docker pull "$IMAGE_NAME:latest"

            echo "Stop and remove old container if exists..."
            docker stop time-server-api || true
            docker rm time-server-api || true

            echo "Run new container..."
            docker run -d \
              --name time-server-api \
              --restart=always \
              -p 8000:8000 \
              "$IMAGE_NAME:latest"

